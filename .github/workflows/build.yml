name: Build installers

# Push a version tag (e.g. `git tag v1.0.3 && git push origin v1.0.3`) to build
# Windows, macOS and Linux installers, test the Mac and Windows apps with
# tests/e2e.mjs, and publish them as a GitHub Release only if every build and test
# passed. "Run workflow" in the Actions tab builds and tests without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check the Mac app's signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(ls -d release/mac-arm64/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|Format" || true

      # Opens the packaged app and uses it like a person would: writes pages, opens a
      # project in the side panel, closes and quits it, and checks the files on disk.
      # If anything fails, the release is not published. (Skipped on Linux, which
      # would need a virtual screen.)
      - name: Test the packaged app
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: node tests/e2e.mjs --packaged

      - name: Keep the test screenshots
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

      - name: Keep installers as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: installers-*
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Fernando Notion ${TAG#v}" --notes-file .github/release-notes.md
          fi
